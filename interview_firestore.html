<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المقابلة - نظام المقابلات الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #60a5fa;
            --primary-dark: #3b82f6;
            --primary-darker: #2563eb;
            --primary-light: #93c5fd;
            --bg-dark: #0f172a;
            --bg-darker: #020617;
            --bg-light: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: rgba(96, 165, 250, 0.2);
            --success: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
            color: var(--text-primary);
        }

        .interview-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .interview-header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            text-align: center;
        }

        .interview-header h2 {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .job-title {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .question-counter {
            font-weight: 600;
            color: var(--primary-light);
        }

        .progress-bar {
            background: rgba(96, 165, 250, 0.1);
            height: 10px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            height: 100%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
        }

        .question-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .question-text {
            color: var(--text-primary);
            font-size: 1.3rem;
            line-height: 1.8;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .answer-section {
            margin-top: 30px;
        }

        .answer-label {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .answer-input {
            width: 100%;
            min-height: 180px;
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: 15px;
            font-size: 1.05rem;
            font-family: 'Cairo', sans-serif;
            resize: vertical;
            transition: all 0.3s;
            background: rgba(15, 23, 42, 0.5);
            color: var(--text-primary);
            line-height: 1.7;
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.7);
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.1);
        }

        .answer-input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(96, 165, 250, 0.4);
            margin-top: 20px;
            width: 100%;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(96, 165, 250, 0.5);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .previous-questions {
            margin-top: 40px;
        }

        .previous-questions h3 {
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .prev-qa {
            background: rgba(96, 165, 250, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border-right: 3px solid rgba(96, 165, 250, 0.4);
        }

        .prev-question {
            color: var(--primary-light);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .prev-answer {
            color: var(--text-muted);
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .prev-score {
            display: inline-block;
            background: rgba(96, 165, 250, 0.2);
            color: var(--primary-light);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 6px solid rgba(96, 165, 250, 0.2);
            border-top: 6px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--primary-light);
            font-size: 1.3rem;
            font-weight: 600;
        }

        .completion-screen {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            animation: slideIn 0.6s;
        }

        .completion-icon {
            font-size: 5rem;
            margin-bottom: 25px;
        }

        .completion-screen h2 {
            color: var(--success);
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .final-score-display {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 4rem;
            font-weight: bold;
            padding: 30px;
            border-radius: 20px;
            margin: 30px 0;
            box-shadow: 0 8px 25px rgba(96, 165, 250, 0.4);
        }

        .completion-message {
            color: var(--text-muted);
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .btn-return {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 15px 40px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-return:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .interview-header {
                padding: 25px;
            }

            .interview-header h2 {
                font-size: 1.6rem;
            }

            .question-card {
                padding: 25px;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .final-score-display {
                font-size: 3rem;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="interview-container" id="interviewContainer">
        <!-- المحتوى يتم تحميله ديناميكياً -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            doc,
            getDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLn9QQAByyGzI3lD5FBCNGurzbv_kvR7w",
            authDomain: "smart-interview-system-dd643.firebaseapp.com",
            projectId: "smart-interview-system-dd643",
            storageBucket: "smart-interview-system-dd643.firebasestorage.app",
            messagingSenderId: "992351376418",
            appId: "1:992351376418:web:0aa361087e8d33a686667b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ✅ Google AI (Gemini) API Key
        const GOOGLE_AI_KEY = "AIzaSyCkm6iTL7bakvesuOA8JLRqEQnHpA_Cxts";
        const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${GOOGLE_AI_KEY}`;

        const MAX_QUESTIONS = 10;
        
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        const currentInterviewData = JSON.parse(localStorage.getItem('currentInterview') || 'null');

        if (!currentUser || !currentInterviewData) {
            window.location.href = 'applicant-dashboard_firestore.html';
        }

        let interview = null;
        let job = null;
        let currentAnswer = '';
        let isProcessing = false;

        async function loadInterviewData() {
            try {
                console.log('📥 تحميل بيانات المقابلة...');
                
                const interviewDoc = await getDoc(doc(db, "interviews", currentInterviewData.interviewId));
                if (!interviewDoc.exists()) {
                    console.error('❌ المقابلة غير موجودة');
                    window.location.href = 'applicant-dashboard_firestore.html';
                    return;
                }
                interview = { id: interviewDoc.id, ...interviewDoc.data() };
                console.log('✅ تم تحميل المقابلة:', interview);

                const jobDoc = await getDoc(doc(db, "jobs", currentInterviewData.jobId));
                if (!jobDoc.exists()) {
                    console.error('❌ الوظيفة غير موجودة');
                    window.location.href = 'applicant-dashboard_firestore.html';
                    return;
                }
                job = { id: jobDoc.id, ...jobDoc.data() };
                console.log('✅ تم تحميل الوظيفة:', job);

                if (!interview.currentQuestion && interview.questions.length === 0) {
                    await generateNextQuestion();
                } else {
                    renderInterface();
                }
            } catch (error) {
                console.error('❌ خطأ في تحميل بيانات المقابلة:', error);
                alert('حدث خطأ في تحميل المقابلة: ' + error.message);
                window.location.href = 'applicant-dashboard_firestore.html';
            }
        }

        function renderInterface() {
            const container = document.getElementById('interviewContainer');
            
            if (interview.status === 'completed') {
                showCompletionScreen();
                return;
            }

            const progress = (interview.questions.length / MAX_QUESTIONS) * 100;

            container.innerHTML = `
                <div class="interview-header">
                    <h2>المقابلة</h2>
                    <div class="job-title">الوظيفة: ${job.title}</div>
                    <div class="progress-info">
                        <span class="question-counter">السؤال ${interview.questions.length + 1} من ${MAX_QUESTIONS}</span>
                        <span>${Math.round(progress)}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                </div>

                ${isProcessing ? `
                    <div class="question-card">
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <div class="loading-text">جارٍ معالجة طلبك...</div>
                            <p style="color: var(--text-muted); margin-top: 15px;">يرجى الانتظار قليلاً</p>
                        </div>
                    </div>
                ` : interview.currentQuestion ? `
                    <div class="question-card">
                        <div class="question-label">
                            <span>السؤال ${interview.questions.length + 1}</span>
                        </div>
                        <div class="question-text">${interview.currentQuestion}</div>

                        <div class="answer-section">
                            <div class="answer-label">
                                <span>إجابتك:</span>
                            </div>
                            <textarea 
                                class="answer-input" 
                                id="answerInput"
                                placeholder="اكتب إجابتك هنا... كن واضحاً ومفصلاً قدر الإمكان"
                                oninput="window.updateAnswer(this.value)"
                            >${currentAnswer}</textarea>
                            <button 
                                class="btn-submit" 
                                onclick="window.submitAnswer()"
                                ${!currentAnswer.trim() ? 'disabled' : ''}
                                id="submitBtn"
                            >
                                إرسال الإجابة
                            </button>
                        </div>

                        ${interview.questions.length > 0 ? `
                            <div class="previous-questions">
                                <h3>الأسئلة السابقة</h3>
                                ${interview.questions.map((qa, index) => `
                                    <div class="prev-qa">
                                        <div class="prev-question">س${index + 1}: ${qa.question}</div>
                                        <div class="prev-answer"><strong>الإجابة:</strong> ${qa.answer.substring(0, 100)}${qa.answer.length > 100 ? '...' : ''}</div>
                                        <div style="margin-top: 10px;">
                                            <span class="prev-score">الدرجة: ${qa.score}/10</span>
                                            <span style="color: var(--text-muted); margin-right: 15px; font-size: 0.9rem;">${qa.feedback}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                ` : ''}
            `;

            const answerInput = document.getElementById('answerInput');
            if (answerInput && !isProcessing) {
                answerInput.focus();
            }
        }

        window.updateAnswer = function(value) {
            currentAnswer = value;
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.disabled = !value.trim();
            }
        };

        async function callGeminiAPI(prompt) {
            console.log('🤖 استدعاء Gemini API...');
            
            const response = await fetch(GEMINI_API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: prompt
                        }]
                    }]
                })
            });

            if (!response.ok) {
                const errorData = await response.text();
                console.error('❌ خطأ من Gemini API:', errorData);
                throw new Error(`API Error: ${response.status} - ${response.statusText}`);
            }

            const data = await response.json();
            console.log('✅ استجابة Gemini API:', data);
            
            if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                throw new Error('استجابة غير صالحة من API');
            }

            return data.candidates[0].content.parts[0].text;
        }

        async function generateNextQuestion() {
            isProcessing = true;
            renderInterface();

            try {
                console.log('🤖 توليد سؤال جديد...');
                
                const prompt = `أنت مُقابِل محترف في مجال التوظيف. أنت تُجري مقابلة لوظيفة "${job.title}".

المهارات المطلوبة: ${job.skills}

السياق:
- عدد الأسئلة المطروحة حتى الآن: ${interview.questions.length}
- الحد الأقصى للأسئلة: ${MAX_QUESTIONS}

${interview.questions.length > 0 ? `الأسئلة السابقة وتقييماتها:
${interview.questions.map((q, i) => `${i + 1}. السؤال: ${q.question}
   الدرجة: ${q.score}/10`).join('\n')}` : ''}

المطلوب:
اطرح سؤالاً مهنياً واحداً فقط يختبر واحدة من المهارات المطلوبة.
السؤال يجب أن يكون:
- مباشراً ومحدداً
- يختبر المعرفة العملية
- مختلفاً عن الأسئلة السابقة

أجب بالصيغة التالية فقط (بدون أي نص إضافي):
{
  "question": "نص السؤال هنا"
}`;

                const aiResponse = await callGeminiAPI(prompt);
                
                const jsonMatch = aiResponse.match(/\{[\s\S]*\}/);
                if (!jsonMatch) {
                    console.error('❌ فشل في استخراج JSON:', aiResponse);
                    throw new Error('فشل في استخراج السؤال');
                }
                
                const questionData = JSON.parse(jsonMatch[0]);
                console.log('✅ السؤال المولد:', questionData);
                
                interview.currentQuestion = questionData.question;
                await updateDoc(doc(db, "interviews", interview.id), {
                    currentQuestion: interview.currentQuestion
                });
                
                isProcessing = false;
                renderInterface();

            } catch (err) {
                isProcessing = false;
                console.error('❌ خطأ في توليد السؤال:', err);
                alert('حدث خطأ في توليد السؤال: ' + err.message + '\n\nيرجى المحاولة مرة أخرى.');
                window.location.href = 'applicant-dashboard_firestore.html';
            }
        }

        window.submitAnswer = async function() {
            if (!currentAnswer.trim() || isProcessing) return;

            isProcessing = true;
            renderInterface();

            try {
                console.log('🤖 تقييم الإجابة...');
                
                const prompt = `أنت خبير تقييم في مجال التوظيف.

السؤال المطروح: ${interview.currentQuestion}
المهارات المطلوبة للوظيفة: ${job.skills}

إجابة المتقدم:
"${currentAnswer}"

قيّم هذه الإجابة بناءً على:
1. الدقة الفنية
2. الوضوح
3. العمق المعرفي
4. مدى ملاءمتها للوظيفة

أجب بالصيغة التالية فقط (بدون أي نص إضافي):
{
  "score": رقم من 0 إلى 10,
  "feedback": "تعليق قصير (جملتان كحد أقصى) عن الإجابة"
}`;

                const aiResponse = await callGeminiAPI(prompt);
                
                const jsonMatch = aiResponse.match(/\{[\s\S]*\}/);
                if (!jsonMatch) {
                    console.error('❌ فشل في استخراج JSON:', aiResponse);
                    throw new Error('فشل في استخراج التقييم');
                }
                
                const evaluation = JSON.parse(jsonMatch[0]);
                console.log('✅ التقييم:', evaluation);

                interview.questions.push({
                    question: interview.currentQuestion,
                    answer: currentAnswer,
                    score: evaluation.score,
                    feedback: evaluation.feedback
                });

                const totalScore = interview.questions.reduce((sum, q) => sum + q.score, 0);
                interview.finalScore = Math.round((totalScore / (interview.questions.length * 10)) * 100);

                if (interview.questions.length >= MAX_QUESTIONS) {
                    interview.status = 'completed';
                    interview.currentQuestion = null;
                    
                    await updateDoc(doc(db, "interviews", interview.id), {
                        questions: interview.questions,
                        currentQuestion: null,
                        status: 'completed',
                        finalScore: interview.finalScore
                    });
                    
                    isProcessing = false;
                    showCompletionScreen();
                    return;
                }

                interview.currentQuestion = null;
                currentAnswer = '';
                
                await updateDoc(doc(db, "interviews", interview.id), {
                    questions: interview.questions,
                    currentQuestion: null,
                    finalScore: interview.finalScore
                });

                isProcessing = false;
                
                setTimeout(generateNextQuestion, 1000);

            } catch (err) {
                isProcessing = false;
                console.error('❌ خطأ في تقييم الإجابة:', err);
                alert('حدث خطأ في تقييم الإجابة: ' + err.message + '\n\nيرجى المحاولة مرة أخرى.');
                renderInterface();
            }
        };

        function showCompletionScreen() {
            const container = document.getElementById('interviewContainer');
            
            container.innerHTML = `
                <div class="completion-screen">
                    <div class="completion-icon">🎉</div>
                    <h2>تم إنهاء المقابلة بنجاح!</h2>
                    <div class="final-score-display">${interview.finalScore}%</div>
                    <div class="completion-message">
                        <p>تم تقييم <strong>${interview.questions.length}</strong> سؤال بنجاح</p>
                        <p style="margin-top: 15px; color: var(--success); font-weight: 600;">
                            سيتم مراجعة طلبك من قبل فريق التوظيف قريباً
                        </p>
                    </div>
                    <button class="btn-return" onclick="window.returnToDashboard()">
                        العودة إلى الوظائف
                    </button>
                </div>
            `;

            localStorage.removeItem('currentInterview');

            setTimeout(() => {
                window.location.href = 'applicant-dashboard_firestore.html';
            }, 5000);
        }

        window.returnToDashboard = function() {
            window.location.href = 'applicant-dashboard_firestore.html';
        };

        loadInterviewData();
    </script>
</body>
</html>
